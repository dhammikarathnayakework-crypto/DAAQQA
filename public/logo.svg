<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <!-- High-contrast Solid branding design that bypasses local Vite CSS analyzer bugs -->
  <g transform="translate(6, 6)">
    <!-- Typographic acronym: S C L in solid Royal Blue (#0052D4) -->
    
    <!-- "S" with thick, clear curves -->
    <path d="M 32 64 C 32 54, 14 54, 14 66 C 14 76, 33 76, 33 84 C 33 94, 15 94, 15 84" 
          stroke="#0052D4" 
          stroke-width="11" 
          stroke-linecap="round" 
          stroke-linejoin="round" 
          fill="none" />
          
    <!-- "C" with perfect semicircular curve -->
    <path d="M 57 64 C 57 53, 39 53, 39 74 C 39 95, 57 95, 57 84" 
          stroke="#0052D4" 
          stroke-width="11" 
          stroke-linecap="round" 
          stroke-linejoin="round" 
          fill="none" />
          
    <!-- "L" aligned perfectly -->
    <path d="M 74 52 V 83 H 90" 
          stroke="#0052D4" 
          stroke-width="11" 
          stroke-linecap="round" 
          stroke-linejoin="round" 
          fill="none" />

    <!-- Seth Capital Brand Wings (Aesthetic Swoops in SCL Custom Royal Blue & Gold) -->
    <!-- Left Wing (Brand Royal Blue #0052D4) -->
    <path d="M 68 44 C 64 28, 78 18, 91 4 C 84 22, 73 32, 68 44 Z" 
          fill="#0052D4" />
          
    <!-- Right Wing (Brand Yellow Gold #FF9000) -->
    <path d="M 73 39 C 82 22, 101 26, 110 13 C 100 29, 85 33, 73 39 Z" 
          fill="#FF9000" />
  </g>
</svg>
